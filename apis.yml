description: >-
  Recursive (Recursive Superintelligence) is an AI research company based in San Francisco and London
  building recursive self-improving superintelligence to automate knowledge discovery. Its team of 25+
  former OpenAI, DeepMind, Google Brain, and Meta researchers works on open-ended algorithms,
  quality-diversity methods, self-improving coding agents, automated red teaming, AI-generating
  algorithms, world models, vision transformers, and RAG systems, initially targeting the automation of
  AI research before expanding to other scientific disciplines. As of this pass Recursive publishes no
  public API, developer portal, or SDKs; this profile tracks the company's identity and web presence in
  the API Evangelist network.
